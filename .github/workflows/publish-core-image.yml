name: Publish Runtime Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional image tag to publish, for example oidc-group-sync
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and Push ${{ matrix.component }} Image
    strategy:
      fail-fast: false
      matrix:
        component: [core, periphery]
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/komodo-${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Read source version
        id: version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' client/core/rs/Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bin/${{ matrix.component }}/aio.Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
